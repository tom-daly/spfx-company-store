# Builds the web part and publishes it as a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag sets the package's version, so SharePoint sees each release as an update.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    # Windows, because that's where this project's build is developed and run.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Set the package version from the tag
        run: node .github/scripts/stamp-version.js "$GITHUB_REF_NAME"

      - name: Build, test and package
        run: npm run build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            sharepoint/solution/react-company-store.sppkg \
            --title "Company Store ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
